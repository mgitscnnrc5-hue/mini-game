<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Practice the FiveM sequence hack. Type a single line of 30 random letters in 15 seconds.">
  <meta name="theme-color" content="#101210">
  <title>Cipher Relay · FiveM practice</title>
  <style>
    :root{color-scheme:dark;--bg:#101210;--panel:#191c19;--line:#363b34;--dim:#a6ada1;--text:#f0f1e9;--lime:#ceff77;--red:#ff9286;--mono:"IBM Plex Mono",Consolas,monospace;--sans:"Space Grotesk","Segoe UI",Arial,sans-serif}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;color:var(--text);background:var(--bg);font-family:var(--sans)}
    button,input{font:inherit}
    button{cursor:pointer}
    button:focus-visible{outline:3px solid white;outline-offset:5px}
    .top{border-bottom:1px solid #30342e}
    .bar,main{width:min(980px,calc(100% - 64px));margin:auto}
    .bar{min-height:68px;display:flex;align-items:center;justify-content:space-between}
    .brand{display:flex;align-items:center;gap:12px;font-size:21px;letter-spacing:-1px;font-weight:700}
    .logo{position:relative;display:inline-block;width:27px;height:29px;background:var(--lime);clip-path:polygon(0 22%,74% 0,74% 24%,24% 39%,24% 53%,99% 31%,99% 55%,24% 77%,24% 92%,0 100%)}
    .mode{display:flex;align-items:center;gap:9px;color:#b4bbaf;font:12px var(--mono)}
    .mode i{width:8px;height:8px;border:1px solid #a5be90;box-shadow:inset 0 0 0 2px var(--bg);background:#a5be90}
    main{padding:clamp(28px,5vh,60px) 0 32px}
    .intro{position:relative;overflow:hidden;display:flex;align-items:center;min-height:114px;margin-bottom:22px}
    .intro-text{z-index:1}
    h1{margin:0 0 8px;font-size:clamp(40px,5vw,64px);line-height:1.04;letter-spacing:-.062em;font-weight:650}
    .intro p{font-size:16px;line-height:1.55;color:#b4bbae;margin:0}
    #signal{position:absolute;right:0;top:0;width:32%;height:100%;pointer-events:none}
    .console{border:1px solid #41473d;border-radius:14px;overflow:hidden;background:var(--panel);box-shadow:0 12px 32px #0002}
    .metrics{display:flex;align-items:center;gap:clamp(20px,5vw,64px);padding:24px 30px 22px;border-bottom:1px solid var(--line);background:linear-gradient(105deg,#20251e,#1a1d19 65%)}
    .label{color:var(--dim);font:11px/1.3 var(--mono);letter-spacing:.12em;text-transform:uppercase}
    .reading{display:flex;align-items:baseline;margin:5px 0 0;font:600 clamp(32px,4vw,44px)/1 var(--mono);letter-spacing:-.07em;font-variant-numeric:tabular-nums}
    #time{color:var(--lime)}
    .unit,.total{margin-left:7px;font-size:18px;font-weight:400;color:#9da595;letter-spacing:-.06em}
    .metric + .metric{border-left:1px solid #3c4238;padding-left:clamp(20px,5vw,64px)}
    .status{display:flex;align-items:center;gap:8px;border:1px solid #464e40;border-radius:30px;margin-left:auto;padding:7px 12px;color:#c5cdbe;font:12px var(--mono);white-space:nowrap}
    .status::before{content:"";width:6px;height:6px;border-radius:100%;background:currentColor}
    .status.live,.status.won{color:var(--lime);border-color:#53683e}
    .status.lost{color:var(--red);border-color:#744d45}
    .board{position:relative;padding:24px 30px 26px}
    .board-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
    .board-head h2{margin:0;color:#c0c7ba;font:11px var(--mono);letter-spacing:.12em;text-transform:uppercase}
    .tick{width:43px;height:7px;background:repeating-linear-gradient(120deg,transparent 0 4px,#64705b 4px 6px)}
    .grid{position:relative;display:flex;flex-wrap:nowrap;gap:3px;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:thin;scrollbar-color:#536149 transparent}
    .tile{flex:1 0 24px;position:relative;display:grid;place-items:center;height:clamp(45px,6.7vh,67px);border:1px solid #373d34;background:#20241f;border-radius:5px;color:#c2c9bb;font:500 22px/1 var(--mono)}
    .tile.current{color:#18230d;background:var(--lime);border-color:var(--lime);box-shadow:0 0 18px #ceff7714}
    .tile.current::after{content:"";position:absolute;bottom:5px;width:13px;height:2px;background:#435b2a}
    .tile.done{color:#add581;background:#293522;border-color:#495e39}
    .tile.done::after{content:"";position:absolute;right:5px;bottom:5px;width:6px;height:3px;border-left:1px solid #bde590;border-bottom:1px solid #bde590;transform:rotate(-45deg)}
    .tile.wrong,.tile.expired{color:#ffd0c9;background:#55322d;border-color:var(--red)}
    .tile.wrong::after{background:var(--red)}
    .tile.wrong{animation:nudge .16s linear}
    @keyframes nudge{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
    .controls{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:17px 30px 20px;border-top:1px solid var(--line);background:#171a16}
    .hint{display:flex;align-items:center;gap:9px;color:#b7bfb0;font-size:14px;line-height:1.4}
    .prompt{font:600 16px var(--mono);color:#97ad80}
    .action{display:flex;align-items:center;justify-content:center;gap:20px;flex-shrink:0;border:1px solid transparent;border-radius:6px;background:var(--lime);color:#18210f;font-weight:650;padding:12px 18px}
    .action:hover{background:#deffa4}
    .action.secondary{background:#252a22;color:var(--text);border-color:#4a5343}
    .action.secondary:hover{background:#323a2d}
    .arrow{font-size:17px}
    footer{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:17px;color:#a7afa0;font:12px/1.7 var(--mono)}
    kbd{font:11px var(--mono);background:#1f231e;border:1px solid #434a3e;border-radius:3px;padding:2px 6px;color:#d3d8ce}
    .best{color:#cbd2c5}
    .sr,.capture{position:absolute;width:1px;height:1px;padding:0;margin:0;border:0;clip-path:inset(50%);overflow:hidden;white-space:nowrap}
    @media(max-width:720px){.bar,main{width:calc(100% - 36px)}.intro{min-height:96px}.intro p{max-width:400px}#signal{width:22%;opacity:.45}.metrics,.board,.controls{padding-left:18px;padding-right:18px}}
    @media(max-width:560px){.bar{min-height:54px}.brand{font-size:18px}.mode{font-size:10px}.intro{margin-bottom:15px;min-height:0}.intro p{font-size:14px;max-width:90%}#signal{display:none}.metrics{gap:12px;padding-top:16px;padding-bottom:16px}.metric + .metric{padding-left:14px}.label{font-size:9px}.status{font-size:10px;padding:5px 8px}.unit,.total{font-size:14px}.board{padding-top:17px;padding-bottom:18px}.tile{height:39px}.controls{flex-wrap:wrap;padding-top:13px;padding-bottom:15px}.action{width:100%;padding:10px}.hint{font-size:13px}.shortcut{display:none}footer{justify-content:flex-end}.reading{font-size:31px}}
    @media(prefers-reduced-motion:reduce){.tile.wrong{animation:none}}
  </style>
</head>
<body>
  <header class="top"><div class="bar"><div class="brand"><span class="logo" aria-hidden="true"></span>Cipher Relay</div><span class="mode"><i aria-hidden="true"></i>FiveM practice</span></div></header>
  <main>
    <section class="intro"><div class="intro-text"><h1>Sequence hack</h1><p>Type all 30 letters from left to right in 15 seconds.</p></div><canvas id="signal" aria-hidden="true"></canvas></section>
    <section class="console" aria-label="Practice terminal">
      <div class="metrics">
        <div class="metric"><div class="label">Time left</div><div class="reading" role="timer"><span id="time">15.00</span><span class="unit">s</span></div></div>
        <div class="metric"><div class="label">Letters typed</div><div class="reading"><span id="count">00</span><span class="total">/ 30</span></div></div>
        <span class="status" id="status">Standby</span>
      </div>
      <div class="board">
        <div class="board-head"><h2 id="board-title">Letter sequence</h2><span class="tick" aria-hidden="true"></span></div>
        <div class="grid" id="grid" aria-labelledby="board-title"></div>
        <input id="capture" class="capture" aria-label="Type the highlighted letter" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" inputmode="text" tabindex="-1" disabled>
      </div>
      <div class="controls"><div class="hint" role="status"><span class="prompt" aria-hidden="true">&gt;_</span><span id="message">Start a round to generate your sequence.</span></div><button type="button" class="action" id="action"><span id="action-text">Start round</span><span class="arrow" aria-hidden="true">↗</span></button></div>
    </section>
    <footer><span class="shortcut"><kbd>Enter</kbd> <span id="shortcut-text">start round</span></span><span>Personal best <span class="best" id="best">—</span></span></footer>
  </main>
  <script>
    'use strict';
    const byId = id => document.getElementById(id);
    const grid = byId('grid'), capture = byId('capture'), action = byId('action');
    const length = 30, duration = 15000, bestKey = 'cipher-relay.best-ms.v1';
    let phase = 'idle', sequence = [], index = 0, misses = 0, deadline = 0, frame = 0, flash = 0, best = 0;
    try { best = Number(localStorage.getItem(bestKey)) || 0; } catch {}
    function showBest() {
      byId('best').textContent = best > 0 && best < duration ? (best / 1000).toFixed(2) + ' s' : '—';
    }
    function makeSequence() {
      return Array.from({length}, () => String.fromCharCode(65 + Math.floor(Math.random() * 26)));
    }
    function makeBoard() {
      grid.replaceChildren(...sequence.map(letter => {
        const tile = document.createElement('span');
        tile.className = 'tile';
        tile.textContent = letter;
        return tile;
      }));
    }
    function setStatus(label, style) {
      byId('status').textContent = label;
      byId('status').className = 'status ' + style;
    }
    function setAction(label, secondary) {
      byId('action-text').textContent = label;
      action.classList.toggle('secondary', secondary);
      action.lastElementChild.textContent = secondary ? '↺' : '↗';
    }
    function highlight() {
      const tile = grid.children[index];
      tile.classList.add('current');
      grid.scrollLeft = Math.max(0, tile.offsetLeft - grid.clientWidth / 3);
      capture.setAttribute('aria-label', 'Type ' + sequence[index] + ', letter ' + (index + 1) + ' of 30');
    }
    function finish(won, now) {
      phase = won ? 'won' : 'lost';
      cancelAnimationFrame(frame);
      clearTimeout(flash);
      const remaining = Math.max(0, deadline - now);
      const elapsed = duration - remaining;
      byId('time').textContent = (remaining / 1000).toFixed(2);
      if (won) {
        if (!(best > 0 && best <= elapsed)) {
          best = elapsed;
          try { localStorage.setItem(bestKey, String(best)); } catch {}
          showBest();
        }
        setStatus('Access granted', 'won');
        byId('message').textContent = 'Cleared in ' + (elapsed / 1000).toFixed(2) + ' s · ' + misses + (misses === 1 ? ' mistake.' : ' mistakes.');
      } else {
        grid.children[index].className = 'tile expired';
        setStatus('Time expired', 'lost');
        byId('message').textContent = 'Time’s up. You cleared ' + index + ' of 30 letters.';
      }
      capture.disabled = true;
      setAction('Try again', false);
      byId('shortcut-text').textContent = 'try again';
      action.focus({preventScroll:true});
    }
    function tick() {
      const now = performance.now();
      if (now >= deadline) return finish(false, now);
      byId('time').textContent = ((deadline - now) / 1000).toFixed(2);
      frame = requestAnimationFrame(tick);
    }
    function start() {
      cancelAnimationFrame(frame);
      clearTimeout(flash);
      sequence = makeSequence();
      index = 0;
      misses = 0;
      phase = 'live';
      makeBoard();
      highlight();
      byId('count').textContent = '00';
      byId('message').textContent = 'Type the highlighted letter.';
      setStatus('In progress', 'live');
      setAction('Restart', true);
      byId('shortcut-text').textContent = 'restart round';
      capture.disabled = false;
      capture.value = '';
      capture.focus({preventScroll:true});
      deadline = performance.now() + duration;
      tick();
    }
    function typeLetter(letter) {
      if (phase !== 'live' || !/^[a-z]$/i.test(letter)) return;
      const now = performance.now();
      if (now >= deadline) return finish(false, now);
      const tile = grid.children[index];
      clearTimeout(flash);
      if (letter.toUpperCase() !== sequence[index]) {
        misses++;
        tile.classList.add('wrong');
        byId('message').textContent = 'Try ' + sequence[index] + ' again.';
        flash = setTimeout(() => tile.classList.remove('wrong'), 200);
        return;
      }
      tile.className = 'tile done';
      index++;
      byId('count').textContent = String(index).padStart(2, '0');
      if (index === length) return finish(true, now);
      byId('message').textContent = 'Type the highlighted letter.';
      highlight();
    }
    action.addEventListener('click', start);
    document.addEventListener('keydown', event => {
      if (event.ctrlKey || event.metaKey || event.altKey || event.isComposing) return;
      if (event.key === 'Enter') {
        event.preventDefault();
        if (!event.repeat) start();
      } else if (phase === 'live' && /^[a-z]$/i.test(event.key)) {
        event.preventDefault();
        if (!event.repeat) typeLetter(event.key);
      }
    });
    capture.addEventListener('input', event => {
      const value = capture.value;
      capture.value = '';
      if (event.inputType !== 'insertFromPaste' && value.length === 1) typeLetter(value);
    });
    capture.addEventListener('paste', event => event.preventDefault());
    grid.addEventListener('click', () => { if (phase === 'live') capture.focus({preventScroll:true}); });
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && phase === 'live' && performance.now() >= deadline) finish(false, performance.now());
    });
    // Draw a dotted signal wave at the display's native resolution.
    function drawSignal() {
      const canvas = byId('signal');
      const w = canvas.clientWidth, h = canvas.clientHeight;
      if (!w || !h) return;
      const scale = window.devicePixelRatio || 1;
      canvas.width = Math.round(w * scale);
      canvas.height = Math.round(h * scale);
      const ctx = canvas.getContext('2d');
      if (!ctx) return;
      ctx.scale(scale, scale);
      for (let row = 0; row < 18; row++) {
        const v = row / 17;
        for (let x = 0; x < w; x += 5) {
          const u = x / w, wave = Math.sin(u * 9 + v * 2.6);
          const y = h * (.44 + wave * .22 + (v - .5) * (.29 + .16 * Math.cos(u * 8)));
          const alpha = Math.sin(Math.PI * u) * (.22 + .51 * v);
          ctx.fillStyle = 'rgba(198,244,146,' + alpha + ')';
          ctx.fillRect(x,y,1.7,1.7);
        }
      }
    }
    sequence = makeSequence();
    makeBoard();
    showBest();
    drawSignal();
    window.addEventListener('resize', () => {
      drawSignal();
      if (phase === 'live') highlight();
    });
  </script>
</body>
</html>
